# PLAN.md §46.8 — shared infrastructure. Redis backs the cross-replica rate
# limit, cache and realtime bus (never a source of truth); PgBouncer
# (transaction pooling) sits between every app/worker replica and Postgres.
# Runtime DB traffic goes through PgBouncer (DATABASE_URL); migrations and
# pg-boss, which need session features (advisory locks), use the direct URL.
x-ziyrak-env: &ziyrak-env
  DATABASE_URL: postgresql://postgres:postgres@pgbouncer:5432/owly?schema=public
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/owly?schema=public
  DATABASE_POOL_MAX: "10"
  REDIS_URL: redis://:${REDIS_PASSWORD:-owly-local-redis}@redis:6379
  NODE_ENV: production
  # L2.1: this stack is local/self-test, not a production deployment, so it skips the strict production
  # configuration contract (https URL, trusted proxy hops, SMTP...). Remove this line, and satisfy
  # `npm run config:check`, for a real deployment. See docs/guides/operator-setup.md.
  ZIYRAK_CONFIG_PROFILE: relaxed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: owly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not a source of truth: no persistence, bounded memory, evict only keys
    # that carry a TTL (rate-limit windows, cache entries).
    # `noeviction`: when full, writes fail (callers fall back per process)
    # rather than silently dropping other clients' rate-limit counters.
    # Authenticated (set REDIS_PASSWORD in .env) and bound to loopback.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:-owly-local-redis}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-owly-local-redis}
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # PLAN.md §28.4 — transaction pooling. Sizing: Postgres allows 100
  # connections by default; DEFAULT_POOL_SIZE caps what PgBouncer opens to
  # Postgres no matter how many app/worker replicas connect to it.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  app:
    build: .
    image: ziyrak:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *ziyrak-env
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness (503 while the database is down), so dependants and operators see the truth (L2.1 / F04).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
    deploy:
      resources:
        limits:
          memory: 2G

  # PLAN.md §25.3/§46.6 PR2 — a deliberate separate deployable from `app`
  # from day one (same image, different entrypoint), so Phase 8's "scale
  # workers independently of web replicas" is only a deployment-config
  # change (a replica count), never an architectural one.
  worker:
    image: ziyrak:local
    restart: unless-stopped
    # `exec node --import tsx` (not `npm run worker`): npm as PID 1 swallows
    # SIGTERM, so the worker could not drain in-flight jobs on stop/scale-down.
    command: ["sh", "-c", "npx prisma migrate deploy && exec node --import tsx src/worker.ts"]
    stop_grace_period: 45s
    # The image's HTTP check does not apply: the worker has no HTTP server. It proves life by refreshing a file
    # every ~15 s, and only after its database write succeeds (src/lib/ops/worker-heartbeat.ts).
    healthcheck:
      test: ["CMD", "node", "-e", "const f=process.env.WORKER_HEARTBEAT_FILE||require('os').tmpdir()+'/ziyrak-worker-heartbeat';try{process.exit(Date.now()-require('fs').statSync(f).mtimeMs<60000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    environment:
      <<: *ziyrak-env
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # PLAN.md §46.8 — a second app and worker replica for the multi-replica
  # check (`docker compose --profile scale up`; scripts/loadtest/run.sh
  # drives it). Explicit services on distinct host ports rather than
  # `--scale`, so the harness can address each replica directly.
  app-2:
    image: ziyrak:local
    profiles: ["scale"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      <<: *ziyrak-env
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy

  worker-2:
    image: ziyrak:local
    profiles: ["scale"]
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/worker.ts"]
    stop_grace_period: 45s
    environment:
      <<: *ziyrak-env
    env_file:
      - .env
    depends_on:
      worker:
        condition: service_started

volumes:
  postgres_data:
  whatsapp_auth:
