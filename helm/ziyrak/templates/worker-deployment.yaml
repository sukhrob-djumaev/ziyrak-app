apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ziyrak.fullname" . }}-worker
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ziyrak.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ziyrak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      # PLAN.md §46.8 — longer than the worker's own 30 s drain (src/worker.ts),
      # so a scale-down lets in-flight jobs finish instead of killing them.
      terminationGracePeriodSeconds: 45
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ziyrak.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migration.enabled }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: {{ include "ziyrak.fullname" . }}
            - secretRef:
                name: {{ include "ziyrak.secretName" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        # PLAN.md §25.3/§46.6 PR2 — the standalone worker process
        # (src/worker.ts, `npm run worker`): a deliberate separate
        # deployable from the main app Deployment from day one, so scaling
        # workers independently of web replicas (Phase 8) is only a
        # `worker.replicaCount` change, never an architectural one. No HTTP
        # port/probes — it has no server to expose; liveness is
        # process-level (Kubernetes restarts it if the process exits).
        - name: {{ .Chart.Name }}-worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--enable-source-maps", "dist/worker.cjs"]
          envFrom:
            - configMapRef:
                name: {{ include "ziyrak.fullname" . }}
            - secretRef:
                name: {{ include "ziyrak.secretName" . }}
          env:
            {{- if and .Values.redis.enabled (not .Values.redis.external.url) }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ziyrak.fullname" . }}-redis
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ include "ziyrak.fullname" . }}-redis:6379"
            {{- end }}
          # The worker has no HTTP server; it refreshes a file every ~15 s after a successful database write
          # (src/lib/ops/worker-heartbeat.ts). Stale for a minute = event loop stuck or cut off from the database -> restart. It does not prove jobs are moving; alarm on queue.oldestWaitingSeconds for that.
          startupProbe:
            exec:
              command: &heartbeat ["node", "-e", "const f=process.env.WORKER_HEARTBEAT_FILE||require('os').tmpdir()+'/ziyrak-worker-heartbeat';try{process.exit(Date.now()-require('fs').statSync(f).mtimeMs<60000?0:1)}catch{process.exit(1)}"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: *heartbeat
            periodSeconds: 30
            # Starting node under CPU throttling can exceed the 1 s default and would restart a healthy worker.
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
