name: Docker Publish

# L2.2 / F12: build once, test that image, push that image. Runs only for a published release (or by hand); nothing
# is pushed unless the commit's CI run succeeded and the image passes the same smoke test and scan as in CI.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Require a successful CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status --jq '[.[] | select(.status=="completed")] | map(.conclusion) | if length == 0 then "none" elif all(. == "success") then "success" else "failed" end')"
          echo "CI result for $GITHUB_SHA: $result"
          [ "$result" = "success" ] || { echo "Refusing to publish: CI has not succeeded for this commit." >&2; exit 1; }

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image (once)
        run: docker build --build-arg APP_BUILD_SHA=${{ github.sha }} -t ziyrak:release .

      - name: Smoke-test the image
        run: scripts/release/image-smoke.sh ziyrak:release ${{ github.sha }}

      - name: Scan the image
        run: scripts/release/image-scan.sh ziyrak:release

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image and report its digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag ziyrak:release "$tag"
            docker push "$tag"
          done
          first="$(echo "$TAGS" | head -1)"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$first")"
          echo "Published digest: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Deploy by digest. Built from $GITHUB_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
