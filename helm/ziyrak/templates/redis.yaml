{{- if and .Values.redis.enabled (not .Values.redis.external.url) }}
# PLAN.md §29/§46.8 — in-cluster Redis for the shared rate limit, cache and
# realtime bus. Not a source of truth: no persistence, bounded memory, evicts
# only keys that carry a TTL. Prefer a managed/HA Redis in production
# (redis.external.url).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ziyrak.fullname" . }}-redis
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  # Kept across upgrades (looked up); generated on first install.
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-redis" (include "ziyrak.fullname" .)) }}
  password: {{ if .Values.redis.password }}{{ .Values.redis.password | quote }}{{ else if $existing }}{{ index $existing.data "password" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ziyrak.fullname" . }}-redis
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ziyrak.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "ziyrak.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          # noeviction: when full, writes fail and callers fall back per
          # process, instead of silently dropping other clients' counters.
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ziyrak.fullname" . }}-redis
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ziyrak.fullname" . }}-redis
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "ziyrak.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
