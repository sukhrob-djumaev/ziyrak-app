{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ziyrak.fullname" . }}
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "ziyrak.runtimeDatabaseUrl" . | quote }}
  DIRECT_DATABASE_URL: {{ include "ziyrak.directDatabaseUrl" . | quote }}
  {{- if .Values.redis.external.url }}
  REDIS_URL: {{ .Values.redis.external.url | quote }}
  {{- end }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  # Encryption keys by version: secrets.encryptionKeys: {"1": "...", "2": "..."} -> SECRET_KEY_V1, SECRET_KEY_V2.
  {{- range $version, $key := .Values.secrets.encryptionKeys }}
  SECRET_KEY_V{{ $version }}: {{ $key | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionActiveVersion }}
  SECRET_KEY_ACTIVE_VERSION: {{ .Values.secrets.encryptionActiveVersion | quote }}
  {{- end }}
  {{- if .Values.secrets.platformBootstrapProofSha256 }}
  PLATFORM_BOOTSTRAP_PROOF_SHA256: {{ .Values.secrets.platformBootstrapProofSha256 | quote }}
  {{- end }}
  {{- if .Values.secrets.platformRecoveryProofSha256 }}
  PLATFORM_RECOVERY_PROOF_SHA256: {{ .Values.secrets.platformRecoveryProofSha256 | quote }}
  {{- end }}
  {{- if .Values.smtp.user }}
  PLATFORM_SMTP_USER: {{ .Values.smtp.user | quote }}
  {{- end }}
  {{- if .Values.secrets.healthDetailToken }}
  HEALTH_DETAIL_TOKEN: {{ .Values.secrets.healthDetailToken | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  PLATFORM_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioAccountSid }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioAuthToken }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.twilioPhoneNumber }}
  TWILIO_PHONE_NUMBER: {{ .Values.secrets.twilioPhoneNumber | quote }}
  {{- end }}
  {{- if .Values.secrets.elevenLabsApiKey }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenLabsApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookSecret }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  {{- end }}
{{- end }}
