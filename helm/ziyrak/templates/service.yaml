apiVersion: v1
kind: Service
metadata:
  name: {{ include "ziyrak.fullname" . }}
  labels:
    {{- include "ziyrak.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "ziyrak.selectorLabels" . | nindent 4 }}
    # Only the web pods: worker/redis/pgbouncer pods share the name/instance
    # labels and must never become endpoints (PLAN.md §46.8 review).
    app.kubernetes.io/component: web
