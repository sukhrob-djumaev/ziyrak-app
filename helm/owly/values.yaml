# Owly Helm Chart - Default Values

replicaCount: 1

image:
  repository: ghcr.io/hesper-labs/owly
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Pod security
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Service
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: owly.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: owly-tls
    #   hosts:
    #     - owly.example.com

# -- Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# -- Autoscaling (PLAN.md §46.8)
# Safe to enable because the rate limiter, cache and realtime bus are shared
# through Redis and runtime DB connections go through PgBouncer; the
# multi-replica load test (scripts/loadtest/run.sh) is the evidence. The chart
# refuses to render with more than one replica (or autoscaling) and no Redis —
# without it each replica would keep its own rate-limit window and miss the
# other replicas' realtime events, silently. The worker scales on CPU; a
# queue-depth policy needs a custom-metrics adapter (pg-boss exposes depth).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- Worker (PLAN.md §25.3/§46.6 PR2) — a separate Deployment running
# `npm run worker` (src/worker.ts) against the same image, so it can be
# scaled independently of the web app's replicaCount above.
worker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Health probes
probes:
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3

# -- Database (external PostgreSQL)
database:
  # Provide either `url` OR individual fields (host, port, etc.)
  url: ""
  host: "postgresql"
  port: 5432
  name: "owly"
  user: "postgres"
  password: "postgres"
  sslMode: "prefer"

# -- Redis (PLAN.md §29/§46.8): shared rate limit, cache and realtime bus. Never a
# source of truth — an outage degrades to per-process behavior, it does not
# lose data. In production prefer a managed/HA Redis: set `external.url` (a
# redis:// or rediss:// URL) and the in-cluster instance below is not created.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  external:
    url: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 300Mi

# -- PgBouncer (PLAN.md §28.4/§46.8): transaction pooling between every
# app/worker replica and PostgreSQL. Runtime traffic uses it (DATABASE_URL);
# migrations and the job queue use the direct URL (DIRECT_DATABASE_URL) because
# they need session-level advisory locks. Size: defaultPoolSize bounds the
# connections opened to PostgreSQL regardless of replica count; keep
# defaultPoolSize <= postgres max_connections minus headroom for the direct
# connections (migrations + each worker's job queue).
pgbouncer:
  enabled: true
  image:
    repository: edoburu/pgbouncer
    tag: v1.25.1-p0
  maxClientConn: 500
  defaultPoolSize: 20
  reservePoolSize: 5
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# -- Application config (non-sensitive)
config:
  # Per-process connection pool size (DATABASE_POOL_MAX). With PgBouncer this
  # is client connections to the pooler; without it, to PostgreSQL itself:
  # then size it as (postgres_max_connections / total_replicas) minus headroom.
  databasePoolMax: 10
  nodeEnv: "production"
  appUrl: "http://localhost:3000"
  corsOrigin: ""

# -- Secrets (sensitive)
secrets:
  # Use existingSecret to reference a pre-created K8s Secret. It must then also
  # provide DATABASE_URL, DIRECT_DATABASE_URL (when pgbouncer is enabled) and
  # REDIS_URL.
  existingSecret: ""
  # Only used when existingSecret is empty:
  jwtSecret: ""
  openaiApiKey: ""
  twilioAccountSid: ""
  twilioAuthToken: ""
  twilioPhoneNumber: ""
  elevenLabsApiKey: ""
  webhookSecret: ""

# -- Database migration (init container)
migration:
  enabled: true

# -- Persistent storage for WhatsApp Web sessions (dev/demo adapter only, PLAN.md
# §20.1/§27.2). Off by default: a ReadWriteOnce volume cannot be mounted by
# autoscaled app replicas on different nodes, and that adapter is single-
# instance by design. Enable it only for a one-replica demo deployment.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# -- Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# -- Pod annotations
podAnnotations: {}
