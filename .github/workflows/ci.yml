name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ziyrak_test?schema=public
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ziyrak_test?schema=public
  ZIYRAK_DISPOSABLE_DB: ziyrak_test
  JWT_SECRET: ci-test-secret-key-do-not-use-in-production

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyrak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # PLAN.md §46.8 — the Redis adapters' contract tests need a real Redis,
      # and the suite is run a second time with Redis selected.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Continuation workflow safety
        run: python3 scripts/agent/test_workflow.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm run test
        env:
          REDIS_TEST_URL: redis://localhost:6379

      # The same suite, unchanged, with the Redis-backed rate limiter, cache,
      # realtime bus and placement cache selected (PLAN.md §46.8 acceptance).
      - name: Test (Redis-backed adapters selected)
        run: npm run test
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build

  # L2.2 / F12: test the container image itself, not only the source tree. The image is built once, run under the
  # strict production configuration with a real Postgres (web, worker, heartbeat, build identity, no dev weight),
  # and scanned. The publish workflow repeats exactly these steps and pushes the image it just tested.
  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Build image
        run: docker build --build-arg APP_BUILD_SHA=${{ github.sha }} -t ziyrak:ci .

      - name: Smoke-test the image
        run: scripts/release/image-smoke.sh ziyrak:ci ${{ github.sha }}

      - name: Scan the image (fixable HIGH/CRITICAL fail the build)
        run: scripts/release/image-scan.sh ziyrak:ci
