services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: owly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/owly?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
    deploy:
      resources:
        limits:
          memory: 2G

  # PLAN.md §25.3/§46.6 PR2 — a deliberate separate deployable from `app`
  # from day one (same image, different entrypoint), so Phase 8's "scale
  # workers independently of web replicas" is only a deployment-config
  # change (a replica count), never an architectural one.
  worker:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/owly?schema=public
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  whatsapp_auth:
